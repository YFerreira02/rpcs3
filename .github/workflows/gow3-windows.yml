# Compilación Windows (MSVC) de este fork para pruebas de rendimiento de
# God of War III en un Ryzen 5 3500U. Copia reducida del trabajo "Windows" de
# rpcs3.yml: sin publicar versiones y sin los demás sistemas.
name: GoW3 Windows build

defaults:
  run:
    shell: bash
on:
  push:
    branches:
      - 'gow3-*'
  workflow_dispatch:

env:
  BUILD_REPOSITORY_NAME: ${{ github.repository }}
  BUILD_SOURCEBRANCHNAME: ${{ github.ref_name }}
  BUILD_SOURCEVERSION: ${{ github.sha }}
  BUILD_ARTIFACTSTAGINGDIRECTORY: ${{ github.workspace }}/artifacts/

jobs:
  Windows_Build:
    name: RPCS3 Windows (${{ github.ref_name }})
    runs-on: windows-2025-vs2026
    env:
      COMPILER: msvc
      QT_VER_MAIN: '6'
      QT_VER: '6.12.0'
      QT_VER_MSVC: 'msvc2022'
      QT_DATE: '202609280346'
      LLVM_VER: '22.1.8'
      VULKAN_VER: '1.4.341.1'
      VULKAN_SDK_SHA: 'bcf2d75aa9556889ab974858666e20b3655b6055a0db704ccb47279ff33b5bfe'
      CCACHE_SHA: '859141059ac950e1e8cd042c66f842f26b9e3a62a1669a69fe6ba180cb58bbdf'
      CCACHE_BIN_DIR: 'C:\ccache_bin'
      CCACHE_DIR: 'C:\ccache'
      CCACHE_INODECACHE: 'true'
      CCACHE_SLOPPINESS: 'time_macros'
      CCACHE_MAXSIZE: '7G'
      DEPS_CACHE_DIR: ./dependency_cache
      SKIP_RPCS3_TEST: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore rpcs3.sln

      - name: Setup env
        shell: pwsh
        run: |
          echo "QTDIR=C:\Qt\${{ env.QT_VER }}\${{ env.QT_VER_MSVC }}_64" >> ${{ github.env }}
          echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VER }}" >> ${{ github.env }}

      - name: Get Cache Keys
        run: .ci/get_keys-windows.sh

      - name: Restore Build Ccache
        uses: actions/cache/restore@main
        id: restore-build-ccache
        with:
          path: ${{ env.CCACHE_DIR }}
          key: "${{ runner.os }}-ccache-${{ env.COMPILER }}-${{ github.ref_name }}-${{ github.run_id }}"
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.COMPILER }}-${{ github.ref_name }}-
            ${{ runner.os }}-ccache-${{ env.COMPILER }}-

      - name: Restore Dependencies Cache
        uses: actions/cache/restore@main
        id: restore-dependencies-cache
        with:
          path: ${{ env.DEPS_CACHE_DIR }}
          key: "${{ runner.os }}-${{ env.COMPILER }}-${{ env.QT_VER }}-${{ env.VULKAN_SDK_SHA }}-${{ env.CCACHE_SHA }}-${{ hashFiles('llvm.lock') }}"
          restore-keys: ${{ runner.os }}-${{ env.COMPILER }}-

      - name: Download and unpack dependencies
        run: |
          .ci/setup-windows.sh
          .ci/setup-windows-ci-vars.sh win64 msvc

      - name: Export Variables
        run: |
          while IFS='=' read -r key val; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "$key=$val" >> "${{ github.env }}"
          done < .ci/ci-vars.env

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@main

      # gow3_opt.targets importa ci_only.targets (LTCG) y añade las opciones de
      # optimización de la rama; en la rama base no añade nada.
      - name: Compile RPCS3
        shell: pwsh
        run: msbuild rpcs3.sln /p:Configuration=Release /v:minimal /p:Platform=x64 /p:PreferredToolArchitecture=x64 /p:CLToolPath=${{ env.CCACHE_BIN_DIR }} /p:UseMultiToolTask=true /p:CustomAfterMicrosoftCommonTargets="${{ github.workspace }}\buildfiles\msvc\gow3_opt.targets"

      # Ramas gow3-pgo-instr*: compilación instrumentada para PGO. Necesita
      # pgort140.dll junto a rpcs3.exe y guarda rpcs3.pgd aparte (lo usará la
      # compilación optimizada junto con los .pgc grabados en el portátil).
      - name: PGO - copiar pgort140.dll y separar rpcs3.pgd
        if: contains(github.ref_name, 'pgo-instr')
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dll = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter pgort140.dll | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dll) { throw "pgort140.dll no encontrado en $vs" }
          Copy-Item $dll.FullName bin\
          Write-Host "pgort140.dll: $($dll.FullName)"
          New-Item -ItemType Directory -Force pgd_out | Out-Null
          Move-Item bin\rpcs3.pgd pgd_out\

      - name: PGO - subir rpcs3.pgd
        if: contains(github.ref_name, 'pgo-instr')
        uses: actions/upload-artifact@main
        with:
          name: rpcs3-pgd-${{ github.ref_name }}-${{ github.sha }}
          path: pgd_out/
          if-no-files-found: error

      - name: Pack up build artifacts
        run: |
          mkdir -p "${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}"
          .ci/deploy-windows.sh

      - name: Upload artifacts (7z)
        uses: actions/upload-artifact@main
        with:
          name: rpcs3-${{ github.ref_name }}-${{ github.sha }}
          path: ${{ env.BUILD_ARTIFACTSTAGINGDIRECTORY }}
          compression-level: 0
          if-no-files-found: error

      - name: Save Build Ccache
        if: always()
        uses: actions/cache/save@main
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-build-ccache.outputs.cache-primary-key }}

      - name: Save Dependencies Cache
        if: steps.restore-dependencies-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@main
        with:
          path: ${{ env.DEPS_CACHE_DIR }}
          key: ${{ steps.restore-dependencies-cache.outputs.cache-primary-key }}
